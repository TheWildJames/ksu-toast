name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODULE_ID: ksu_toast
  RELEASE_TITLE: KSU Toast

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next release version
        id: version
        run: |
          # Find the latest release tag (numeric), increment by 1
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "0")
          # Strip any non-numeric prefix
          LATEST_NUM=$(echo "$LATEST" | grep -oP '^\d+' || echo "0")
          NEXT=$((LATEST_NUM + 1))
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "num=$NEXT" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false

      - name: Build su-wrapper (ARM64)
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android33-clang"
          $CC -static -Os -s -Wall -Wextra -o su wrapper/su-wrapper.c
          $CC -static -Os -s -Wall -Wextra -o sock-test wrapper/sock-test.c
          mkdir -p build/system/bin
          cp su build/system/bin/
          cp sock-test build/system/bin/
          file build/system/bin/su build/system/bin/sock-test
        shell: bash

      - name: Build ksu-toastd (ARM64)
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android33-clang"
          $CC -static -Os -s -Wall -Wextra -pthread -o ksu-toastd daemon/ksu-toastd.c
          mkdir -p build/system/bin
          cp ksu-toastd build/system/bin/
          file build/system/bin/ksu-toastd
        shell: bash

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build companion APK
        run: |
          cd apk
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.num }} \
            -PversionName=v${{ steps.version.outputs.num }}
          cd ..
          mkdir -p build/apk
          # Copy signed release APK (debug-signed via build.gradle.kts)
          cp apk/app/build/outputs/apk/release/app-release.apk build/apk/KsuToast.apk
        shell: bash
        continue-on-error: false

      - name: Package KSU module
        run: |
          mkdir -p dist
          MODULE_DIR="build"
          VERSION="${{ steps.version.outputs.num }}"

          # Copy module scripts
          cp module.prop "$MODULE_DIR/" 2>/dev/null || true
          cp customize.sh "$MODULE_DIR/" 2>/dev/null || true
          cp post-fs-data.sh "$MODULE_DIR/" 2>/dev/null || true
          cp service.sh "$MODULE_DIR/" 2>/dev/null || true
          cp boot-completed.sh "$MODULE_DIR/" 2>/dev/null || true
          cp action.sh "$MODULE_DIR/" 2>/dev/null || true
          cp uninstall.sh "$MODULE_DIR/" 2>/dev/null || true
          cp -r webroot "$MODULE_DIR/" 2>/dev/null || true
          cp sepolicy.rule "$MODULE_DIR/" 2>/dev/null || true

          # Patch version into module.prop
          sed -i "s/^version=.*/version=v${VERSION}/" "$MODULE_DIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${VERSION}/" "$MODULE_DIR/module.prop"

          # Create the module zip (consistent name for auto-update)
          cd "$MODULE_DIR"
          zip -r9 "../dist/${MODULE_ID}.zip" .
          cd ..

          echo "zip_path=dist/${MODULE_ID}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_name=${MODULE_ID}.zip" >> "$GITHUB_OUTPUT"
        id: package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ env.RELEASE_TITLE }} v${{ steps.version.outputs.num }}"
          body: |
            **KSU Toast v${{ steps.version.outputs.num }}**

            Automated build from commit ${{ github.sha }}.

            ## What's new
            - See commit history for details

            ## Installation
            1. Download the `.zip` from Assets
            2. Open KSU Next Manager → Modules → Install from storage
            3. Select the zip
            4. Reboot

            **Requires:** KernelSU Next with working root
          files: ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true

      - name: Update update.json in repo
        run: |
          VERSION="${{ steps.version.outputs.num }}"
          # Patch update.json with the new version
          sed -i "s/\"version\": \".*\"/\"version\": \"v${VERSION}\"/" update.json
          sed -i "s/\"versionCode\": [0-9]*/\"versionCode\": ${VERSION}/" update.json
          # Commit and push back to the repo (skip CI to avoid loop)
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add update.json
          git commit -m "chore: bump update.json to v${VERSION} [skip ci]" || true
          git push
